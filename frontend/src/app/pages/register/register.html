<div class="register-page">
  <div class="register-card">

    <div class="logo">
      <span>CALI</span><strong>MAX</strong>
    </div>

    <h1>Crear cuenta</h1>
    <p class="subtitle">Registrate para comenzar</p>

    <form>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          placeholder="tu@email.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
        />
      </div>

      <div class="form-group">
        <label for="confirm-password">Repetir contraseña</label>
        <input
          id="confirm-password"
          type="password"
          placeholder="••••••••"
        />
      </div>

      <button type="submit">
        Crear cuenta
      </button>
    </form>

    <p class="login-text">
      ¿Ya tenés una cuenta?
      <a href="/login">Iniciá sesión</a>
    </p>

  </div>
</div>
