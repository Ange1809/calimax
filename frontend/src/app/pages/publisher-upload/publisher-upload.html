<div class="publisher-page">
  <main class="upload-card">
    <span class="eyebrow">PANEL PUBLISHER</span>
    <h1>Enviar contenido</h1>
    <p class="subtitle">Los aportes se revisan antes de publicarse.</p>

    <form (ngSubmit)="enviarAporte()">
      <div class="form-group">
        <label for="tmdbId">ID de TMDB (recomendado)</label>
        <input
          id="tmdbId"
          name="tmdbId"
          type="text"
          inputmode="numeric"
          pattern="[0-9]+"
          [(ngModel)]="tmdbId"
          placeholder="Ej.: 550"
        />
      </div>

      <div class="form-group">
        <label for="titulo">Título (si no tienes el ID)</label>
        <input
          id="titulo"
          name="titulo"
          type="text"
          [(ngModel)]="titulo"
          placeholder="Nombre de la película"
        />
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de contenido</label>
        <select id="tipo" name="tipo" [(ngModel)]="tipo">
          <option value="pelicula">Película</option>
          <option value="tv">Serie</option>
        </select>
      </div>

      <section class="links-section">
        <h2>Enlaces del contenido</h2>
        @for (enlace of enlaces; track $index) {
          <div class="link-row">
            <div class="form-group">
              <label [for]="'servidor-' + $index">Plataforma o servidor</label>
              <input
                [id]="'servidor-' + $index"
                [name]="'servidor-' + $index"
                [(ngModel)]="enlace.servidor"
                placeholder="Mega, Drive, Vimeo..."
                required
              />
            </div>
            <div class="form-group">
              <label [for]="'url-' + $index">URL</label>
              <input
                [id]="'url-' + $index"
                [name]="'url-' + $index"
                type="url"
                [(ngModel)]="enlace.url"
                placeholder="https://..."
                required
              />
            </div>
            @if (enlaces.length > 1) {
              <button class="secondary-button" type="button" (click)="quitarEnlace($index)">
                Quitar enlace
              </button>
            }
          </div>
        }

        <button class="secondary-button" type="button" (click)="agregarEnlace()">
          Añadir otro enlace
        </button>
      </section>

      <button class="submit-button" type="submit" [disabled]="enviando">
        {{ enviando ? 'Enviando...' : 'Enviar a moderación' }}
      </button>
    </form>

    @if (mensaje) {
      <p class="success-message" role="status">{{ mensaje }}</p>
    }
    @if (error) {
      <p class="error-message" role="alert">{{ error }}</p>
    }
  </main>
</div>
