<div class="login-page">
  <div class="login-card">

    <div class="logo">
      <span>CALI</span><strong>MAX</strong>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">Iniciá sesión para continuar</p>

    <form (ngSubmit)="iniciarSesion()">

      <div class="form-group">
        <label for="email">Correo electrónico</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

    @if (mensaje) {
      <p class="success-message">
        {{ mensaje }}
      </p>
    }

    @if (error) {
      <p class="error-message">
        {{ error }}
      </p>
    }

    <p class="register-text">
      ¿No tenés una cuenta?
      <a href="/register">Registrate</a>
    </p>

  </div>
</div>
